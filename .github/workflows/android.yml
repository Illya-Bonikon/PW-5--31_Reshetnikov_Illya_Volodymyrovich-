name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Server tests
        working-directory: server
        run: python3 -m unittest discover -s tests -v
      - name: Unit tests and debug APK
        working-directory: BuildingAuditApp
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: BuildingAuditApp/app/build/reports/tests/testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: BuildingAuditApp/app/build/outputs/apk/debug/app-debug.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start test server
        working-directory: server
        run: nohup python3 -m audit_server --host 127.0.0.1 > server.log 2>&1 &
      - name: Instrumented tour on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: BuildingAuditApp
          script: |
            mkdir -p ../screenshots
            adb shell rm -rf /sdcard/Download/screens
            adb emu geo fix 30.4572 50.4489
            adb emu sensor set temperature 21.5
            adb emu sensor set humidity 78
            adb emu sensor set light 240
            adb emu sensor set acceleration 0.6:1.2:9.7
            adb emu sensor set magnetic-field 12:18:-40
            gradle connectedDebugAndroidTest
            adb pull /sdcard/Download/screens ../screenshots
      - name: Print screenshots
        if: always()
        run: |
          tar czf screens.tgz screenshots || exit 0
          echo SCREENS-BEGIN
          base64 -w 3000 screens.tgz
          echo SCREENS-END
          test ! -f screenshots/TESTS_FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots
            server/server.log
            BuildingAuditApp/app/build/reports/androidTests
